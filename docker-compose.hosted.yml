# The hosted service, app.bandstand.info, on its own server (a Hetzner CX23;
# docs/hosting.md has the whole setup). Not on popos: paying bands get a
# server that isn't on a home connection.
#
#   make hosted-deploy        (on that server)
#
# Caddy answers on 80/443 and gets the HTTPS certificate itself. The
# database is dumped every night to ./backups, which the server's own daily
# backups (Hetzner) copy off the machine.
name: bandstand

x-logging: &default-logging # json-file has no rotation by default; cap it
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:16
    container_name: bandstand-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: bandstand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.hosted}
      POSTGRES_DB: bandstand
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bandstand -d bandstand']
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      args:
        APP_ENV: production
        NEXTAUTH_URL: https://${APP_HOST:-app.bandstand.info}
    image: bandstand:latest
    container_name: bandstand-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      NODE_ENV: production
      NEXTAUTH_URL: https://${APP_HOST:-app.bandstand.info}
      AUTH_TRUST_HOST: 'true'
      DATABASE_URL: postgresql://bandstand:${POSTGRES_PASSWORD}@db:5432/bandstand?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env.hosted}
      # Sign-up, trials and billing (src/lib/hosted.ts)
      BANDSTAND_HOSTED: '1'
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env.hosted}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Bandstand <hello@bandstand.info>}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_PRODUCT_ID: ${POLAR_PRODUCT_ID:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_SERVER: ${POLAR_SERVER:-}
      VOTE_THRESHOLD: ${VOTE_THRESHOLD:-2}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@bandstand.info}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:3000/api/health | grep -q ''"ok":true'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    container_name: bandstand-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_HOST: ${APP_HOST:-app.bandstand.info}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.hosted}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # A dump every night at 03:30 UTC, two weeks kept, in ./backups
  backup:
    image: postgres:16
    container_name: bandstand-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: bandstand
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bandstand
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/sh', '/backup.sh']
    configs:
      - source: backup
        target: /backup.sh

configs:
  backup:
    content: |
      set -e
      while :; do
        # Until 03:30 UTC (quiet, and never mid-migration on a fresh start)
        sleep $$(( (86400 + 12600 - $$(date +%s) % 86400) % 86400 + 1 ))
        f=/backups/bandstand-$$(date +%F).dump
        pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: $$f"
        find /backups -name 'bandstand-*.dump' -mtime +14 -delete
      done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
