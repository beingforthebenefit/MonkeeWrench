# Production on popos, published as https://members.monkeebusinessband.com
# through Traefik on the macmini (route: macmini/traefik2/rules/dynamic.toml).
#
#   docker compose -f docker-compose.server.yml --env-file .env.production up -d --build
#
# Standalone (not an override of docker-compose.yml) so it can run beside the
# dev stack on the same host: own project name, own container names, own port.
name: monkeewrench

x-logging:
  &default-logging # json-file has no rotation by default; cap it (see the 76flix Change-Checklist)
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:16
    container_name: monkeewrench-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: monkee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: monkee
    volumes:
      # Not "pgdata": an old 2025 dev volume named monkeewrench_pgdata exists
      # on popos, and Postgres would reuse it (with its old password).
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monkee -d monkee']
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      args:
        APP_ENV: production
        NEXTAUTH_URL: https://members.monkeebusinessband.com
    image: monkeewrench:latest
    container_name: monkeewrench-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '7120:3000'
    environment:
      APP_ENV: production
      NODE_ENV: production
      NEXTAUTH_URL: https://members.monkeebusinessband.com
      DATABASE_URL: postgresql://monkee:${POSTGRES_PASSWORD}@db:5432/monkee?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      # Optional: enables "Sign in with Google" for existing members
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      VOTE_THRESHOLD: ${VOTE_THRESHOLD:-3}
    healthcheck:
      # /api/health queries the database; pages can render while it is down
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:3000/api/health | grep -q ''"ok":true'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  prod_pgdata:
