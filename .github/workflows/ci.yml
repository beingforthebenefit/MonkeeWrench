name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # The demo's dates (next rehearsal, the gig) are relative to when it's
  # built: rebuild it every morning so they never go stale
  schedule:
    - cron: '0 9 * * *'

# Needed for committing badges and deploying GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Keep least privilege at job scope if you prefer
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx prisma generate && npm run typecheck

      - name: Test (with coverage)
        run: |
          npm run test:coverage | tee vitest-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Publish summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          # Grep key lines from Vitest output for quick glance (tolerate ANSI + leading spaces)
          grep -E "Tests[[:space:]]+[0-9]+[[:space:]]+passed" vitest-output.txt >> $GITHUB_STEP_SUMMARY || true
          grep -E "Test Files[[:space:]]+[0-9]+[[:space:]]+passed" vitest-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Raw Vitest Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 200 vitest-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Generate badges JSON
        if: always()
        run: |
          set -euo pipefail
          # Strip ANSI escape codes to make parsing robust
          perl -pe 's/\e\[[\d;]*[A-Za-z]//g' vitest-output.txt | tr -d '\r' > vitest-output.clean.txt || true
          # Extract the last overall "Tests ..." summary line
          tests_line=$(grep -E '^[[:space:]]*Tests[[:space:]]+' vitest-output.clean.txt | tail -n1 || true)
          # Parse counts; sed prints nothing on no-match but exits 0
          passed=$(sed -n 's/.*[[:space:]]\([0-9][0-9]*\)[[:space:]]\{1,\}passed.*/\1/p' <<<"$tests_line" | head -n1)
          failed=$(sed -n 's/.*[[:space:]]\([0-9][0-9]*\)[[:space:]]\{1,\}failed.*/\1/p' <<<"$tests_line" | head -n1)
          skipped=$(sed -n 's/.*[[:space:]]\([0-9][0-9]*\)[[:space:]]\{1,\}skipped.*/\1/p' <<<"$tests_line" | head -n1)
          # Default to 0 if empty
          [ -n "${passed:-}" ] || passed=0
          [ -n "${failed:-}" ] || failed=0
          [ -n "${skipped:-}" ] || skipped=0
          if [ "$failed" -gt 0 ]; then color=red; elif [ "$passed" -gt 0 ]; then color=brightgreen; else color=lightgrey; fi
          mkdir -p badges
          cat > badges/tests.json <<EOF
          {"schemaVersion":1, "label":"tests", "message":"${passed} passed, ${failed} failed", "color":"$color"}
          EOF

          # Coverage badge from the "All files" line in vitest text report
          cov_line=$(grep -E "^[[:space:]]*All files[[:space:]]*\|" vitest-output.txt | head -n1 || true)
          cov_raw=$(awk -F'\|' '{gsub(/[[:space:]]/,"",$2); print $2}' <<<"$cov_line" | head -n1)
          [ -n "${cov_raw:-}" ] || cov_raw=0
          cov_int=$(echo "$cov_raw" | awk '{printf("%.0f", $1)}')
          if [ "$cov_int" -ge 90 ]; then color_cov=brightgreen;
          elif [ "$cov_int" -ge 80 ]; then color_cov=yellowgreen;
          elif [ "$cov_int" -ge 70 ]; then color_cov=yellow;
          elif [ "$cov_int" -ge 50 ]; then color_cov=orange;
          else color_cov=red; fi
          cat > badges/coverage.json <<EOF
          {"schemaVersion":1, "label":"coverage", "message":"${cov_int}%", "color":"$color_cov"}
          EOF

      # Only attempt to commit on pushes to main. PRs (esp. from forks) lack write perms.
      - name: Commit badges (to badges branch)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ci): update test/coverage badges'
          file_pattern: badges/*.json
          branch: badges
          create_branch: true
          push_options: '--force-with-lease'

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage

  # The public demo: the app built in demo mode, captured as static pages
  # from a scratch database (scripts/demo.sh). Rebuilt on every push to main,
  # so it always shows the current UI.
  demo:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The runner's own Postgres: pulling postgres:16 from Docker Hub timed
      # out on GitHub's runners twice on 2026-10-09
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER demo PASSWORD 'demo' CREATEDB" -c "CREATE DATABASE demo OWNER demo"
      - name: Build and capture the demo
        run: scripts/demo.sh demo-out
        env:
          DATABASE_URL: postgresql://demo:demo@localhost:5432/demo?schema=public
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo-out

  # GitHub Pages (bandstand.info): the product page (site/) at the root, the
  # demo beside it (/songs, /setlists, …), this run's coverage under /coverage/
  pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    needs: [build-and-test, demo]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: _site/coverage
      - name: Add the product page
        run: |
          cp -r site/. _site/
          test -f _site/index.html && test -f _site/songs.html && test -d _site/_next/static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The Docker image self-hosters run (selfhost/compose.yml) and the hosted
  # server pulls: ghcr.io/beingforthebenefit/bandstand, tagged latest and
  # sha-<commit>, for x86 and ARM (a Pi, an Apple Silicon Mac). Each is built
  # natively on its own runner, then joined under one tag.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Bandstand
            org.opencontainers.image.description=Charts, setlists and rehearsals for bands
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=ghcr.io/beingforthebenefit/bandstand,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  image-tag:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag latest and sha-<commit>
        working-directory: /tmp/digests
        run: |
          img=ghcr.io/beingforthebenefit/bandstand
          docker buildx imagetools create -t "$img:latest" -t "$img:sha-${GITHUB_SHA::7}" \
            $(printf "$img@sha256:%s " *)
          docker buildx imagetools inspect "$img:sha-${GITHUB_SHA::7}"

  # The hosted service (app.bandstand.info): once the tests pass and the
  # image is published, the server pulls it (or builds, if there's none).
  # Its key can only run deploy/ci-deploy.sh, which deploys only the branch
  # the server runs. docs/hosting.md, "Deploys".
  deploy-hosted:
    # Not held up by a failed image: the server builds one itself then
    if: always() && needs.build-and-test.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hosted')
    needs: [build-and-test, image-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # One at a time, in order; a push during a deploy waits its turn
    concurrency:
      group: deploy-hosted
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ]; then echo "No DEPLOY_SSH_KEY secret: nothing to deploy to"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned: CI only ever talks to this server
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "deploy@$HOST" "$GITHUB_REF_NAME"
