services:
  app:
    build:
      context: .
      # The full toolchain, source mounted over it (Dockerfile)
      target: base
      args:
        APP_ENV: development
    environment:
      APP_ENV: development
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3002
      AUTH_TRUST_HOST: 'true'
      DATABASE_URL: postgresql://monkee:monkee@db:5432/monkee?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      USER_ALLOWLIST: ${USER_ALLOWLIST}
      VOTE_THRESHOLD: ${VOTE_THRESHOLD}
      # The hosted service, to try locally: BANDSTAND_HOSTED=1 MAIL_LOG=1
      # (emails go to the log) make dev-d. See docs/hosting.md.
      BANDSTAND_HOSTED: ${BANDSTAND_HOSTED:-}
      MAIL_LOG: ${MAIL_LOG:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_PRODUCT_ID: ${POLAR_PRODUCT_ID:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_SERVER: ${POLAR_SERVER:-}
      CHOKIDAR_USEPOLLING: 'true' # robust watching in Docker
      WATCHPACK_POLLING: 'true'
    ports:
      - '3002:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
  tools:
    build:
      context: .
      # The full toolchain, source mounted over it (Dockerfile)
      target: base
      args:
        APP_ENV: development
    entrypoint: ''
    # Keep the tools container alive for ad-hoc execs
    command: ['sh', '-lc', 'tail -f /dev/null']
    working_dir: /app
    environment:
      APP_ENV: development
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
